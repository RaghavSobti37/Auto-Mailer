services:
  - type: web
    name: automailer-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: $PORT
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRACKING_BASE_URL
        sync: false
      - key: ONLINE_BACKUP_MONGODB_URI
        sync: false
    healthCheckPath: /health
    autoDeploy: true
